<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CordeValle Newsletter Archive</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="container">
        <h1>CordeValle Newsletter Archive</h1>

        <p>
            Browse 2026 member newsletters, club updates,
            tournament results, event registrations,
            member achievements and golf news.
        </p>

        <input
            type="text"
            id="searchBox"
            placeholder="Search newsletters..."
        >
    </div>
</header>

<main class="container">

    <div id="newsletterGrid"></div>

</main>

<script>

const monthOrder = [
    "October",
    "September",
    "August",
    "July",
    "June",
    "May",
    "April",
    "March",
    "February",
    "January"
];

let allNewsletters = [];

fetch('newsletters.json')
    .then(response => response.json())
    .then(data => {

        allNewsletters = data;

        renderNewsletters(data);
    });

function renderNewsletters(newsletters){

    const container =
        document.getElementById('newsletterGrid');

    container.innerHTML = "";

    monthOrder.forEach(month => {

        const monthItems =
            newsletters
                .filter(item => item.month === month)
                .sort((a,b) => b.week - a.week);

        if(monthItems.length === 0) return;

        const section =
            document.createElement('section');

        section.className = "month-section";

        section.innerHTML = `
            <h2>${month} 2026</h2>

            <div class="grid">

                ${monthItems.map(item => `

                    <div class="card">

    <h3>
        <a
            href="${item.url}"
            target="_blank"
            class="title-link">
            ${item.title}
        </a>
    </h3>

    <p>${item.summary}</p>

</div>

                `).join('')}

            </div>
        `;

        container.appendChild(section);

    });

}

document
    .getElementById('searchBox')
    .addEventListener('input', function(){

        const search =
            this.value.toLowerCase();

        const filtered =
            allNewsletters.filter(item =>
                item.title.toLowerCase().includes(search)
                ||
                item.summary.toLowerCase().includes(search)
            );

        renderNewsletters(filtered);

    });

</script>

</body>
</html>
